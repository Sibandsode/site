<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>
   <!-- Background music only on this page -->
  <audio id="backgroundAudio" autoplay loop>
    <source src="Infinite-Hearts-main/Song.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <div>
    <canvas id="testCanvas"></canvas>
  </div>

  <!-- Floating Album Button -->
  <button id="clickMeBtn" class="floating-btn">Click Me!</button>
 
  <!-- Modal Album -->
  <div id="albumModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h2>Birthday Digital Album</h2>
      <div class="album-gallery">
        <!-- Replace the src with your own images -->
        <img src="https://placekitten.com/200/200" alt="Photo 1">
      </div>
    </div>
  </div>

  <a href="https://createjs.com/" target="_blank"><div class="logo white"></div></a>

  <script src="https://code.jquery.com/jquery-3.1.1.slim.min.js"></script>
  <script src="https://code.createjs.com/1.0.0/easeljs.min.js"></script>
  <script src="script.js"></script>
  <!-- Background Audio -->
<audio autoplay loop>
  <audio id="backgroundAudio" autoplay loop>
  <source src="Infinite-Hearts-main/Song.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script>
const audio = document.getElementById('backgroundAudio');

// Restore playback position
const savedTime = localStorage.getItem('audioTime');
if (savedTime) {
  audio.currentTime = parseFloat(savedTime);
}

// Save playback position every second
audio.addEventListener('timeupdate', function() {
  localStorage.setItem('audioTime', audio.currentTime);
});
document.getElementById('clickMeBtn').onclick = function() {
  window.open('video.html', '_blank');
};

// Simple password protection
  (function() {
    var correct = "nik"; // Change this to your password
    var entered = "";
    while (entered !== correct) {
      entered = prompt("This site is private. Please enter the password:");
      if (entered === null) {
        // User cancelled, redirect or close
        window.location.href = "https://www.google.com";
        return;
      }
    }
  })();
</script>
 <source src="Song.mp3" type="audio/mpeg">
</audio>
<button id="speakerBtn" aria-label="Toggle Music" style="
  position: fixed;

  border: none;

">

</button>
